        <!-- 底部输入区 -->
        <div id="input-area" onclick="event.stopPropagation()">
            <input type="text" id="user-name" placeholder="名字" oninput="resortChat()">
            <textarea id="msg-input" placeholder="输入你想说的话..." onkeydown="handleEnter(event)" onfocus="closeActionMenu()"></textarea>
            <button class="send-action" id="send-btn" onclick="sendMessage()">发送</button>
        </div>
        
    </div>

    <script>
        // ==========================================
        // 0. 瞬间读取夜间主题防闪烁
        // ==========================================
        if (localStorage.getItem('dark_theme') === 'true') document.body.classList.add('dark-theme');

        // ==========================================
        // 1. 系统防御、锁屏与 8 小时硬核防盗锁
        // ==========================================
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        document.addEventListener('keydown', function(e) { 
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) || 
                (e.ctrlKey && ['U','u'].includes(e.key))
            ) { 
                e.preventDefault(); 
            } 
        });
        
        setInterval(function() { 
            try { 
                (function() { return false; }['constructor']('debugger')()); 
            } catch (err) {} 
        }, 1000);

        let tapCount = 0; 
        let tapTimer = null; 
        let idleTimer = null; 
        const IDLE_TIMEOUT = 10 * 60 * 1000;

        function isDeepLocked() {
            const lockUntil = parseInt(localStorage.getItem('deep_lock_until') || '0', 10);
            return Date.now() < lockUntil;
        }

        function lockScreen() { 
            document.getElementById('stealth-cover').style.display = 'flex'; 
            sessionStorage.removeItem('unlocked'); 
            sessionStorage.removeItem('history_pwd_unlocked'); 
            tapCount = 0; 
        }
        
        function resetIdleTimer() { 
            clearTimeout(idleTimer); 
            if (sessionStorage.getItem('unlocked') === 'true' && !isDeepLocked()) { 
                idleTimer = setTimeout(lockScreen, IDLE_TIMEOUT); 
            } 
        }
        
        let idleThrottle = false; 
        function throttledReset() { 
            if (idleThrottle) return; 
            idleThrottle = true; 
            resetIdleTimer(); 
            setTimeout(() => { idleThrottle = false; }, 2000); 
        }
        
        ['mousemove', 'mousedown', 'keypress', 'touchstart', 'scroll'].forEach(evt => { 
            document.addEventListener(evt, throttledReset, { passive: true }); 
        });
        
        // 常规左上角 3 次点击解锁
        document.getElementById('secret-trigger').addEventListener('click', function() { 
            if (isDeepLocked()) return; 

            tapCount++; 
            clearTimeout(tapTimer); 
            
            if (tapCount >= 3) { 
                document.getElementById('stealth-cover').style.display = 'none'; 
                sessionStorage.setItem('unlocked', 'true'); 
                resetIdleTimer(); 
            } 
            
            tapTimer = setTimeout(() => { tapCount = 0; }, 500); 
        });

        // 8小时深度硬锁序列：5次英文 -> 5次404大标题
        let unlockSequenceStage = 0; 
        let unlockStageTimer = null;
        let descClickCount = 0;
        let descClickTimer = null;
        let h1ClickCount = 0;
        let h1ClickTimer = null;

        document.getElementById('stealth-desc').addEventListener('click', function(e) {
            e.stopPropagation();
            descClickCount++;
            clearTimeout(descClickTimer);
            if (descClickCount >= 5) {
                descClickCount = 0;
                unlockSequenceStage = 1;
                clearTimeout(unlockStageTimer);
                unlockStageTimer = setTimeout(() => { unlockSequenceStage = 0; }, 6000);
            } else {
                descClickTimer = setTimeout(() => { descClickCount = 0; }, 1500);
            }
        });

        document.getElementById('stealth-title').addEventListener('click', function(e) {
            e.stopPropagation();
            h1ClickCount++;
            clearTimeout(h1ClickTimer);

            if (h1ClickCount >= 5) {
                h1ClickCount = 0;
                if (unlockSequenceStage === 1) {
                    unlockSequenceStage = 0;
                    clearTimeout(unlockStageTimer);
                    showEmergencyUnlockModal();
                } else {
                    const eightHoursMs = 8 * 60 * 60 * 1000;
                    localStorage.setItem('deep_lock_until', (Date.now() + eightHoursMs).toString());
                    sessionStorage.removeItem('unlocked');
                    sessionStorage.removeItem('history_pwd_unlocked');
                    
                    const el = document.getElementById('stealth-title');
                    el.classList.add('error-shake');
                    setTimeout(() => el.classList.remove('error-shake'), 400);
                }
            } else {
                h1ClickTimer = setTimeout(() => { h1ClickCount = 0; }, 1500);
            }
        });

        if (sessionStorage.getItem('unlocked') === 'true' && !isDeepLocked()) { 
            document.getElementById('stealth-cover').style.display = 'none'; 
            resetIdleTimer(); 
        } else {
            lockScreen();
        }
        
        document.addEventListener("visibilitychange", function() { 
            if (document.hidden) {
                lockScreen(); 
            }
        });

        // ==========================================
        // 1.5 极简小卡片密码锁系统
        // ==========================================
        let pendingPwdCallback = null;

        function checkHistoryPassword(callback) {
            if (sessionStorage.getItem('history_pwd_unlocked') === 'true' && !isDeepLocked()) { 
                callback();
            } else {
                pendingPwdCallback = callback;
                const overlay = document.getElementById('pwd-overlay');
                const input = document.getElementById('pwd-input');
                overlay.style.display = 'flex';
                input.value = '';
                setTimeout(() => input.focus(), 100);
            }
        }

        function showEmergencyUnlockModal() {
            pendingPwdCallback = function() {
                localStorage.removeItem('deep_lock_until'); 
                document.getElementById('stealth-cover').style.display = 'none';
                sessionStorage.setItem('unlocked', 'true');
                sessionStorage.setItem('history_pwd_unlocked', 'true');
                resetIdleTimer();
            };
            const overlay = document.getElementById('pwd-overlay');
            const input = document.getElementById('pwd-input');
            overlay.style.display = 'flex';
            input.value = '';
            setTimeout(() => input.focus(), 100);
        }

        function closePwdOverlay() {
            document.getElementById('pwd-overlay').style.display = 'none';
            pendingPwdCallback = null;
        }

        function verifyAndSubmitPassword() {
            const input = document.getElementById('pwd-input');
            const val = input.value.trim();
            if (val === '0831') {
                sessionStorage.setItem('history_pwd_unlocked', 'true');
                const cb = pendingPwdCallback;
                closePwdOverlay();
                if (typeof cb === 'function') cb();
            } else {
                input.value = '';
                input.classList.add('error-shake');
                setTimeout(() => input.classList.remove('error-shake'), 300);
            }
        }

        function handlePwdEnter(e) {
            if (e.key === 'Enter' || e.keyCode === 13) {
                e.preventDefault();
                verifyAndSubmitPassword();
            }
        }

        function handlePwdInput(e) {
            const val = e.target.value.trim();
            if (val.length === 4 && val === '0831') {
                verifyAndSubmitPassword();
            }
        }

        // ==========================================
        // 2. Firebase 初始化与环境设置
        // ==========================================
        const firebaseConfig = { 
            apiKey: "AIzaSyB0iOMZPM8CfJxLaeyXvdwfG_H5GMONCjc", 
            authDomain: "blabalaba-69dc2.firebaseapp.com", 
            databaseURL: "https://blabalaba-69dc2-default-rtdb.firebaseio.com", 
            projectId: "blabalaba-69dc2", 
            storageBucket: "blabalaba-69dc2.firebasestorage.app", 
            messagingSenderId: "393868557271", 
            appId: "1:393868557271:web:0b27791b67248bcf9de992" 
        };
        
        firebase.initializeApp(firebaseConfig); 
        const db = firebase.database(); 
        const ROOM_PREFIX = "mads0330/";
        
        let lastDate = ""; 
        let currentView = "live"; 
        let currentReplyTarget = null; 
        let currentLiveDate = "";
        let lastMsgTimestamp = 0; 
        let lastPatTime = 0;       
        let globalDatesList = []; // 全局维护已排序的日期列表
        
        const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        window.onload = function() {
            const savedName = localStorage.getItem('chat_username');
            if (savedName) { 
                document.getElementById('user-name').value = savedName; 
                updatePresence(); 
            }
            
            checkVipStatus(); 
            monitorPresence(); 
            monitorAnnouncement(); 
            
            if (localStorage.getItem('dark_theme') === 'true') {
                document.getElementById('theme-toggle-btn').innerText = '☀️';
            }
            
            setTimeout(() => { loadSidebarDates(); }, 500); 
            
            if (!isMobileDevice) { 
                document.getElementById('msg-input').placeholder = "按 Enter 发送，Shift+Enter 换行..."; 
            } else { 
                document.getElementById('msg-input').placeholder = "输入你想说的话..."; 
            }
        };

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-theme');
            document.getElementById('theme-toggle-btn').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('dark_theme', isDark ? 'true' : 'false');
        }

        function toggleSidebar() { 
            document.getElementById('sidebar').classList.toggle('collapsed'); 
        }
        
        // ==========================================
        // 3. Reminder 公告板逻辑
        // ==========================================
        function toggleAnnouncement(e) { 
            if (e.target.tagName === 'BUTTON') return; 
            const body = document.getElementById('announcement-body'); 
            const icon = document.querySelector('.announcement-header .icon'); 
            if (body.style.display === 'none' || body.style.display === '') { 
                body.style.display = 'block'; 
                icon.innerText = '▼'; 
            } else { 
                body.style.display = 'none'; 
                icon.innerText = '▶'; 
            } 
        }
        
        function monitorAnnouncement() { 
            db.ref(ROOM_PREFIX + 'announcement').on('value', snapshot => { 
                document.getElementById('announcement-content').innerText = snapshot.val() || "暂时没有 reminder 记录。"; 
            }); 
        }
        
        function toggleEditAnnouncement(e) { 
            if (e) e.stopPropagation(); 
            const body = document.getElementById('announcement-body'); 
            if (body.style.display === 'none' || body.style.display === '') { 
                toggleAnnouncement({target: body}); 
            } 
            
            const contentDiv = document.getElementById('announcement-content'); 
            const editArea = document.getElementById('announcement-edit-area'); 
            const saveBtn = document.getElementById('save-announcement-btn'); 
            const editBtn = document.getElementById('edit-announcement-btn'); 
            
            if (editArea.style.display === 'none' || editArea.style.display === '') { 
                contentDiv.style.display = 'none'; 
                editArea.style.display = 'block'; 
                saveBtn.style.display = 'block'; 
                editBtn.innerText = '取消'; 
                db.ref(ROOM_PREFIX + 'announcement').once('value').then(snap => { 
                    editArea.value = snap.val() || ""; 
                    editArea.focus(); 
                }); 
            } else { 
                contentDiv.style.display = 'block'; 
                editArea.style.display = 'none'; 
                saveBtn.style.display = 'none'; 
                editBtn.innerText = '编辑'; 
            } 
        }
        
        function saveAnnouncement() { 
            const text = document.getElementById('announcement-edit-area').value.trim(); 
            db.ref(ROOM_PREFIX + 'announcement').set(text).then(() => { 
                toggleEditAnnouncement(); 
            }); 
        }
        
        // ==========================================
        // 4. 在线状态 / 秘密探测仪
        // ==========================================
        function updatePresence() { 
            const name = document.getElementById('user-name').value.trim(); 
            if (name) { 
                const now = new Date(); 
                db.ref(ROOM_PREFIX + 'presence/' + name).set({ 
                    timeStr: now.toLocaleDateString() + " " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), 
                    timestamp: now.getTime() 
                }); 
            } 
        }
        
        function checkVipStatus() { 
            const name = document.getElementById('user-name').value.trim(); 
            document.getElementById('vip-presence-area').style.display = (name === "me") ? 'block' : 'none'; 
        }
        
        function monitorPresence() { 
            db.ref(ROOM_PREFIX + 'presence').on('value', snapshot => { 
                const listDiv = document.getElementById('presence-list'); 
                listDiv.innerHTML = ""; 
                let activeCount = 0; 
                const nowMs = new Date().getTime(); 
                
                if (snapshot.exists()) { 
                    snapshot.forEach(child => { 
                        const userName = child.key; 
                        const data = child.val(); 
                        let lastTimeStr = ""; 
                        let lastTimestamp = 0; 
                        
                        if (typeof data === 'string') { 
                            lastTimeStr = data; 
                            lastTimestamp = new Date(data.replace(/年|月/g, '/').replace(/日/g, '')).getTime(); 
                        } else if (data && data.timestamp) { 
                            lastTimeStr = data.timeStr; 
                            lastTimestamp = data.timestamp; 
                        } 
                        
                        if(userName !== "me" && !isNaN(lastTimestamp) && (nowMs - lastTimestamp) <= 86400000) { 
                            const div = document.createElement('div'); 
                            div.innerText = `👤 ${userName}: ${lastTimeStr}`; 
                            listDiv.appendChild(div); 
                            activeCount++; 
                        } 
                    }); 
                } 
                
                if (activeCount === 0) { 
                    listDiv.innerHTML = "<div style='color:#aaa; font-style:italic;'>24小时内暂无活跃记录</div>"; 
                } 
            }); 
        }
        
        let typingTimer; 
        function resortChat() { 
            clearTimeout(typingTimer); 
            typingTimer = setTimeout(() => { 
                localStorage.setItem('chat_username', document.getElementById('user-name').value.trim()); 
                checkVipStatus(); 
                updatePresence(); 
                if (currentView === "live") { 
                    loadLiveChat(); 
                } 
            }, 500); 
        }

        // ==========================================
        // 5. 抽屉法则 & 后台数据
        // ==========================================
        function loadSidebarDates() {
            db.ref(ROOM_PREFIX + 'active_dates').once('value').then(snap1 => {
                const dateMap = {};
                if (snap1.exists()) {
                    snap1.forEach(child => { dateMap[child.key] = child.val(); });
                    const datesArr = Object.keys(dateMap).map(k => ({ safeDate: k, originalDate: dateMap[k] }));
                    renderSidebarUI(datesArr);
                    loadLiveChat(); 
                    
                    setTimeout(() => {
                        db.ref(ROOM_PREFIX + 'migration_flag').once('value').then(flag => {
                            if (!flag.exists()) {
                                db.ref(ROOM_PREFIX + 'messages').once('value').then(oldSnap => {
                                    let updates = {};
                                    if(oldSnap.exists()) {
                                        oldSnap.forEach(child => {
                                            let v = child.val();
                                            if (v && v.date) {
                                                let safeDate = v.date.replace(/[\/\.]/g, '-');
                                                if (!dateMap[safeDate]) updates['active_dates/' + safeDate] = v.date;
                                            }
                                        });
                                    }
                                    updates['migration_flag'] = true;
                                    db.ref(ROOM_PREFIX).update(updates);
                                });
                            }
                        });
                    }, 3000);
                } else {
                    db.ref(ROOM_PREFIX + 'messages').once('value').then(snap2 => {
                        if (snap2.exists()) {
                            snap2.forEach(child => {
                                let v = child.val();
                                if (v && v.date) {
                                    let safeDate = v.date.replace(/[\/\.]/g, '-');
                                    dateMap[safeDate] = v.date;
                                    db.ref(ROOM_PREFIX + 'active_dates/' + safeDate).set(v.date);
                                }
                            });
                            db.ref(ROOM_PREFIX + 'migration_flag').set(true);
                        }
                        const datesArr = Object.keys(dateMap).map(k => ({ safeDate: k, originalDate: dateMap[k] }));
                        renderSidebarUI(datesArr);
                        loadLiveChat(); 
                    });
                }
            });
        }

        function renderSidebarUI(dates) {
            const dateListDiv = document.getElementById('date-list');
            dateListDiv.innerHTML = '<div class="history-item active" id="live-chat-btn" onclick="loadLiveChat()" style="padding-left:20px;">🔴 返回最新聊天</div>';
            
            const groupedDates = {};
            const sortedDates = dates.sort((a, b) => new Date(b.safeDate.replace(/-/g, '/')).getTime() - new Date(a.safeDate.replace(/-/g, '/')).getTime());
            globalDatesList = sortedDates; // 缓存全局已排序日期列表供分批搜索使用
            
            const distinctYears = new Set();
            const distinctMonths = new Set();

            sortedDates.forEach(item => {
                const d = new Date(item.safeDate.replace(/-/g, '/')); 
                let yearStr = !isNaN(d.getTime()) ? d.getFullYear().toString() : "";
                let monthGroup = !isNaN(d.getTime()) ? d.getFullYear() + "年" + (d.getMonth() + 1) + "月" : "未知记录";
                
                if (yearStr) distinctYears.add(yearStr);
                if (monthGroup !== "未知记录") distinctMonths.add(monthGroup);

                if (!groupedDates[monthGroup]) groupedDates[monthGroup] = []; 
                groupedDates[monthGroup].push(item);
            });

            // 动态填充搜索范围选择下拉框
            const scopeSelect = document.getElementById('search-scope-select');
            if (scopeSelect) {
                scopeSelect.innerHTML = '<option value="all">📅 全部时间</option>';
                
                // 年份分类
                if (distinctYears.size > 0) {
                    const yGroup = document.createElement('optgroup');
                    yGroup.label = '按年份查找';
                    distinctYears.forEach(y => {
                        const opt = document.createElement('option');
                        opt.value = `year:${y}`;
                        opt.innerText = `📆 ${y} 年 (全年)`;
                        yGroup.appendChild(opt);
                    });
                    scopeSelect.appendChild(yGroup);
                }

                // 月份分类
                if (distinctMonths.size > 0) {
                    const mGroup = document.createElement('optgroup');
                    mGroup.label = '按月份查找';
                    distinctMonths.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = `month:${m}`;
                        opt.innerText = `🗓️ ${m}`;
                        mGroup.appendChild(opt);
                    });
                    scopeSelect.appendChild(mGroup);
                }
            }
            
            for (const month in groupedDates) {
                const header = document.createElement('div'); 
                header.className = 'month-header'; 
                header.innerHTML = `<span>${month}</span><span class="icon">▶</span>`;
                
                const content = document.createElement('div'); 
                content.className = 'month-content'; 
                
                header.onclick = () => { 
                    const isOpen = content.classList.contains('open'); 
                    content.classList.toggle('open'); 
                    header.querySelector('.icon').innerText = isOpen ? '▶' : '▼'; 
                };
                
                dateListDiv.appendChild(header); 
                dateListDiv.appendChild(content);
                
                groupedDates[month].forEach(item => {
                    const div = document.createElement('div'); 
                    div.className = 'history-item'; 
                    div.innerText = "📅 " + item.safeDate; 
                    div.dataset.date = item.safeDate; 
                    
                    div.onclick = () => { 
                        checkHistoryPassword(() => {
                            loadHistory(item.safeDate, item.originalDate, div); 
                            if (window.innerWidth <= 600) toggleSidebar(); 
                        });
                    }; 
                    content.appendChild(div);
                });
            }
        }

        // ==========================================
        // 6. 长按菜单与引用动作 
        // ==========================================
        let activeMessageForAction = null; 
        let activeMsgElement = null;
        
        function showActionMenu(name, text, bubbleElement, msgKey, date) { 
            closeActionMenu(); 
            activeMessageForAction = { name: name, text: text, msgKey: msgKey, date: date }; 
            activeMsgElement = bubbleElement; 
            bubbleElement.classList.add('active-long-press'); 
            
            const menu = document.getElementById('wx-action-menu'); 
            const chatBox = document.getElementById('chat-box'); 
            
            menu.style.display = 'block'; 
            menu.classList.remove('arrow-up'); 
            
            const chatRect = chatBox.getBoundingClientRect();
            const bubbleRect = bubbleElement.getBoundingClientRect();

            let topPos = (bubbleRect.top - chatRect.top) + chatBox.scrollTop - menu.offsetHeight - 8;
            let leftPos = (bubbleRect.left - chatRect.left) + (bubbleRect.width / 2) - (menu.offsetWidth / 2);
            
            if (topPos < chatBox.scrollTop) { 
                topPos = (bubbleRect.bottom - chatRect.top) + chatBox.scrollTop + 8; 
                menu.classList.add('arrow-up'); 
            } 
            if (leftPos < 10) leftPos = 10; 
            if (leftPos + menu.offsetWidth > chatBox.clientWidth - 10) {
                leftPos = chatBox.clientWidth - menu.offsetWidth - 10; 
            }
            
            menu.style.top = topPos + 'px'; 
            menu.style.left = leftPos + 'px'; 
        }
        
        function closeActionMenu() { 
            document.getElementById('wx-action-menu').style.display = 'none'; 
            if (activeMsgElement) activeMsgElement.classList.remove('active-long-press'); 
            activeMessageForAction = null; 
            activeMsgElement = null; 
        }
        
        function doCopy() { 
            if (!activeMessageForAction) return; 
            const textArea = document.createElement("textarea"); 
            textArea.value = activeMessageForAction.text; 
            document.body.appendChild(textArea); 
            textArea.select(); 
            try { document.execCommand("Copy"); } catch (err) {} 
            textArea.remove(); 
            closeActionMenu(); 
        }
        
        function doReply() { 
            if (!activeMessageForAction) return; 
            const targetName = activeMessageForAction.name; 
            const safeText = activeMessageForAction.text.replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, ' '); 
            const targetMsgKey = activeMessageForAction.msgKey;
            const targetDate = activeMessageForAction.date;
            
            closeActionMenu(); 
            if (currentView !== "live") loadLiveChat(); 
            initiateReply(targetName, safeText, targetMsgKey, targetDate); 
        }
        
        function initiateReply(name, text, msgKey, date) { 
            currentReplyTarget = { name: name, text: text, msgKey: msgKey, date: date }; 
            document.getElementById('reply-preview').style.display = 'block'; 
            document.getElementById('reply-text-preview').innerText = `回复 ${name}: ${text}`; 
            document.getElementById('msg-input').focus(); 
        }
        
        function cancelReply() { 
            currentReplyTarget = null; 
            document.getElementById('reply-preview').style.display = 'none'; 
        }

        // ==========================================
        // 6.5 双击拍一拍逻辑
        // ==========================================
        let nameTapTrack = { name: '', time: 0 };
        function handleNamePat(e, el) {
            e.stopPropagation();
            const targetName = el.dataset.name || '';
            const now = Date.now();
            if (nameTapTrack.name === targetName && (now - nameTapTrack.time < 500)) {
                triggerPat(targetName, el);
                nameTapTrack = { name: '', time: 0 };
            } else {
                nameTapTrack = { name: targetName, time: now };
            }
        }

        function triggerPat(targetName, nameEl) {
            const now = Date.now();
            if (now - lastPatTime < 3000) return; 
            lastPatTime = now;

            if (nameEl) {
                nameEl.classList.remove('pat-shake');
                void nameEl.offsetWidth;
                nameEl.classList.add('pat-shake');
            }

            const myName = document.getElementById('user-name').value.trim() || '我';
            const dateObj = new Date();
            const safeDate = dateObj.toLocaleDateString().replace(/[\/\.]/g, '-');
            const originalDate = dateObj.toLocaleDateString();

            const nudgePayload = {
                type: 'nudge',
                sender: myName,
                target: targetName,
                date: safeDate,
                time: dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                timestamp: dateObj.getTime()
            };

            db.ref(ROOM_PREFIX + 'daily_messages/' + safeDate).push(nudgePayload).then(() => {
                db.ref(ROOM_PREFIX + 'active_dates/' + safeDate).set(originalDate);
            });
        }

        function safeParseTimestamp(dateStr, timeStr) {
            if (!dateStr || !timeStr) return 0;
            let safeDatePart = dateStr.replace(/[\.\-]/g, '/');
            let isPM = /下午|pm/i.test(timeStr);
            let isAM = /上午|am/i.test(timeStr);
            let timeMatches = timeStr.match(/(\d{1,2}):(\d{1,2})/);
            if (timeMatches) {
                let h = parseInt(timeMatches[1], 10);
                let m = parseInt(timeMatches[2], 10);
                if (isPM && h < 12) h += 12;
                if (isAM && h === 12) h = 0;
                let d = new Date(safeDatePart);
                if (!isNaN(d.getTime())) {
                    d.setHours(h, m, 0, 0);
                    return d.getTime();
                }
            }
            let fallback = new Date(safeDatePart + ' ' + timeStr).getTime();
            return isNaN(fallback) ? 0 : fallback;
        }

        // ==========================================
        // 7. 渲染气泡与 5 分钟时间跨度留白
        // ==========================================
        function renderMessage(data, msgKey) {
            const chatBox = document.getElementById('chat-box');
            
            if (data.date !== lastDate) { 
                const dateDiv = document.createElement('div'); 
                dateDiv.className = 'date-divider'; 
                dateDiv.innerText = `--- ${data.date} ---`; 
                chatBox.appendChild(dateDiv); 
                lastDate = data.date; 
                lastMsgTimestamp = 0; 
            }

            if (data.type === 'nudge') {
                const nudgeDiv = document.createElement('div');
                nudgeDiv.className = 'nudge-divider';
                const isSelfPat = (data.sender === data.target);
                nudgeDiv.innerText = isSelfPat ? `${data.sender} 拍了拍 自己` : `${data.sender} 拍了拍 ${data.target}`;
                chatBox.appendChild(nudgeDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
                return;
            }

            const containerDiv = document.createElement('div'); 
            containerDiv.className = 'msg-container'; 
            containerDiv.id = 'msg-' + msgKey; 
            
            const currentMyName = document.getElementById('user-name').value.trim(); 
            const isMine = ((data.name || "").trim() === currentMyName && currentMyName !== "");
            containerDiv.classList.add(isMine ? 'mine' : 'other');

            let msgTimestamp = data.timestamp || safeParseTimestamp(data.date, data.time);
            if (lastMsgTimestamp && msgTimestamp && (msgTimestamp - lastMsgTimestamp >= 5 * 60 * 1000)) {
                containerDiv.classList.add('msg-gap-5min');
            }
            if (msgTimestamp) {
                lastMsgTimestamp = msgTimestamp;
            }
            
            const metaDiv = document.createElement('div');
            metaDiv.className = 'meta';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'meta-name';
            nameSpan.innerText = data.name || '';
            nameSpan.dataset.name = data.name || '';
            nameSpan.title = '双击拍一拍';
            nameSpan.onclick = function(e) { handleNamePat(e, this); };

            const timeSpan = document.createElement('span');
            timeSpan.innerText = ` \u00A0 ${data.time}`;

            if (isMine) {
                metaDiv.appendChild(timeSpan);
                metaDiv.appendChild(document.createTextNode(' \u00A0 '));
                metaDiv.appendChild(nameSpan);
            } else {
                metaDiv.appendChild(nameSpan);
                metaDiv.appendChild(document.createTextNode(' \u00A0 '));
                metaDiv.appendChild(timeSpan);
            }
            containerDiv.appendChild(metaDiv);

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';

            let quoteHtml = ''; 
            if (data.reply) {
                let jumpAttr = '';
                if (data.reply.date && data.reply.msgKey) {
                    jumpAttr = `onclick="event.stopPropagation(); jumpToContext('${data.reply.date}', '${data.reply.msgKey}')" style="cursor:pointer;" title="点击跳转到原消息"`;
                }
                quoteHtml = `<div class="quote-block" ${jumpAttr}><b>${data.reply.name}：</b>${data.reply.text}</div>`;
            }

            let processedText = data.text || ''; 
            const imgRegex = /(https?:\/\/[^\s]+?\.(?:jpg|jpeg|png|gif|webp))/gi; 
            if (imgRegex.test(processedText)) { 
                processedText = processedText.replace(imgRegex, '<img src="$1" style="max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 5px; display: block;">');
            }
            
            bubbleDiv.innerHTML = quoteHtml + processedText;

            let pressTimer; 
            const startPress = (e) => { 
                e.stopPropagation(); 
                pressTimer = setTimeout(() => { 
                    showActionMenu(data.name, data.text, bubbleDiv, msgKey, data.date); 
                }, 500); 
            }; 
            const cancelPress = () => clearTimeout(pressTimer); 
            
            bubbleDiv.addEventListener('touchstart', startPress, {passive: true}); 
            bubbleDiv.addEventListener('touchend', cancelPress); 
            bubbleDiv.addEventListener('touchmove', cancelPress); 
            bubbleDiv.addEventListener('mousedown', startPress); 
            bubbleDiv.addEventListener('mouseup', cancelPress); 
            bubbleDiv.addEventListener('mouseleave', cancelPress); 

            containerDiv.appendChild(bubbleDiv);
            chatBox.appendChild(containerDiv); 
            chatBox.scrollTop = chatBox.scrollHeight;

            if (currentView === "live") {
                const oldElements = chatBox.querySelectorAll('.msg-container, .date-divider, .nudge-divider, .search-result-card');
                if (oldElements.length > 150) { 
                    for (let i = 0; i < 10; i++) { 
                        if (oldElements[i] && oldElements[i].id !== 'wx-action-menu') {
                            chatBox.removeChild(oldElements[i]); 
                        }
                    } 
                }
            }
        }

        // ==========================================
        // 8. 核心升级：分批抽屉搜索与流式累加计数
        // ==========================================
        let searchState = {
            keyword: "",
            scope: "all",
            filteredDates: [],
            currentIndex: 0,
            foundCount: 0,
            hasMore: false,
            isLoading: false,
            legacyChecked: false
        };

        function handleSearch(e) {
            if (e.key === 'Enter') {
                const keyword = document.getElementById('search-input').value.trim(); 
                if (!keyword) { 
                    loadLiveChat(); 
                    return; 
                }
                
                checkHistoryPassword(() => {
                    const scopeSelect = document.getElementById('search-scope-select');
                    const selectedScope = scopeSelect ? scopeSelect.value : 'all';
                    
                    currentView = "search"; 
                    lastDate = ""; 
                    lastMsgTimestamp = 0;
                    
                    const chatBox = document.getElementById('chat-box'); 
                    Array.from(chatBox.children).forEach(child => { 
                        if(child.id !== 'wx-action-menu') child.remove(); 
                    });

                    // 依据指定范围筛选要查找的日期抽屉
                    const targetDates = globalDatesList.filter(item => {
                        if (selectedScope === 'all') return true;
                        const d = new Date(item.safeDate.replace(/-/g, '/'));
                        if (isNaN(d.getTime())) return false;
                        
                        if (selectedScope.startsWith('year:')) {
                            const y = selectedScope.replace('year:', '');
                            return d.getFullYear().toString() === y;
                        }
                        if (selectedScope.startsWith('month:')) {
                            const m = selectedScope.replace('month:', '');
                            const curMonthStr = d.getFullYear() + "年" + (d.getMonth() + 1) + "月";
                            return curMonthStr === m;
                        }
                        return true;
                    }).map(item => item.safeDate);

                    // 重置搜索状态机
                    searchState = {
                        keyword: keyword,
                        scope: selectedScope,
                        filteredDates: targetDates,
                        currentIndex: 0,
                        foundCount: 0,
                        hasMore: targetDates.length > 0,
                        isLoading: false,
                        legacyChecked: false
                    };

                    document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
                    
                    // 启动第一批次流式检索
                    fetchNextSearchBatch();

                    if(window.innerWidth <= 600) toggleSidebar();
                });
            }
        }

        async function fetchNextSearchBatch() {
            if (searchState.isLoading) return;
            searchState.isLoading = true;

            const chatBox = document.getElementById('chat-box');
            const notice = document.getElementById('history-notice');
            notice.style.display = 'block';

            // 移除已有的“查看更早”按钮，防止重复点击
            const existingBtnContainer = document.getElementById('search-load-more-container');
            if (existingBtnContainer) existingBtnContainer.remove();

            let batchFound = 0;
            const BATCH_TARGET = 6; // 每次搜到6条左右暂停，交还给用户控制
            const CHUNK_DAYS = 10;   // 每次并行检索10天的抽屉

            while (searchState.currentIndex < searchState.filteredDates.length) {
                const chunk = searchState.filteredDates.slice(searchState.currentIndex, searchState.currentIndex + CHUNK_DAYS);
                searchState.currentIndex += chunk.length;

                // 并行拉取这一小批日期的抽屉数据
                const promises = chunk.map(dStr => db.ref(ROOM_PREFIX + 'daily_messages/' + dStr).once('value'));
                const snapshots = await Promise.all(promises);

                for (let snap of snapshots) {
                    if (snap.exists()) {
                        snap.forEach(msgSnap => {
                            const data = msgSnap.val();
                            if (data && data.text && data.text.includes(searchState.keyword)) {
                                appendSearchResult(data, msgSnap.key, chatBox);
                                searchState.foundCount++;
                                batchFound++;
                            }
                        });
                    }
                }

                // 若本批次已经找到足够结果，或者全部日期已扫完，则中断本批次
                if (batchFound >= BATCH_TARGET || searchState.currentIndex >= searchState.filteredDates.length) {
                    break;
                }
            }

            // 如果全部抽屉都翻完了，顺手把旧池子（如果存在）扫一下并标记完成
            if (searchState.currentIndex >= searchState.filteredDates.length && !searchState.legacyChecked) {
                searchState.legacyChecked = true;
                const oldSnap = await db.ref(ROOM_PREFIX + 'messages').once('value');
                if (oldSnap.exists()) {
                    oldSnap.forEach(child => {
                        const data = child.val();
                        if (data && data.text && data.text.includes(searchState.keyword)) {
                            // 检查范围兼容
                            let match = true;
                            if (searchState.scope !== 'all' && data.date) {
                                const d = new Date(data.date.replace(/[\.\-]/g, '/'));
                                if (!isNaN(d.getTime())) {
                                    if (searchState.scope.startsWith('year:')) {
                                        match = (d.getFullYear().toString() === searchState.scope.replace('year:', ''));
                                    } else if (searchState.scope.startsWith('month:')) {
                                        match = (d.getFullYear() + "年" + (d.getMonth() + 1) + "月" === searchState.scope.replace('month:', ''));
                                    }
                                }
                            }
                            if (match) {
                                appendSearchResult(data, child.key, chatBox);
                                searchState.foundCount++;
                                batchFound++;
                            }
                        }
                    });
                }
            }

            searchState.hasMore = (searchState.currentIndex < searchState.filteredDates.length);
            searchState.isLoading = false;

            // 状态机提示文字逻辑严格对齐要求
            if (searchState.hasMore) {
                // 1. 还有更早记录：显示已找到并提示加载更多
                notice.innerText = `「搜索模式」: ${searchState.keyword}，已找到 ${searchState.foundCount} 条 (搜索中/点击加载更多)`;
                
                // 插入加载更多按钮
                const moreContainer = document.createElement('div');
                moreContainer.id = 'search-load-more-container';
                moreContainer.style.textAlign = 'center';
                moreContainer.style.margin = '20px 0 15px 0';
                moreContainer.style.width = '100%';

                const moreBtn = document.createElement('button');
                moreBtn.id = 'search-load-more-btn';
                moreBtn.innerText = '👇 查看更早记录';
                moreBtn.onclick = () => fetchNextSearchBatch();

                moreContainer.appendChild(moreBtn);
                chatBox.appendChild(moreContainer);
            } else {
                // 2. 翻完全部档案：定格文字，按钮自动隐去
                notice.innerText = `「搜索模式」: ${searchState.keyword}，已搜完全部档案，共找到 ${searchState.foundCount} 条相关记录`;
                
                if (searchState.foundCount === 0) {
                    chatBox.insertAdjacentHTML('beforeend', `<div style="text-align:center; color:#888; margin-top:30px; font-size:13px;">没有找到关于 "${searchState.keyword}" 的记录哦~</div>`);
                }
            }
        }

        function appendSearchResult(data, msgKey, chatBox) {
            const msgDiv = document.createElement('div'); 
            msgDiv.className = 'search-result-card';
            msgDiv.innerHTML = `<div class="meta" style="margin-bottom:4px; padding:0;">📅 ${data.date} &nbsp;|&nbsp; 👤 ${data.name} &nbsp;|&nbsp; 🕒 ${data.time}</div><div style="margin: 8px 0; color:#333; font-size:14px; line-height:1.4;">${data.text}</div><div style="font-size:12px; color:#1890ff; font-weight:bold;">👉 点击前往上下文定位</div>`;
            msgDiv.onclick = () => jumpToContext(data.date.replace(/[\/\.]/g, '-'), msgKey); 
            chatBox.appendChild(msgDiv); 
        }

        function jumpToContext(dateStr, msgKey) { 
            checkHistoryPassword(() => {
                let targetEl = null; 
                document.querySelectorAll('.history-item').forEach(el => { 
                    if (el.dataset.date === dateStr) { 
                        targetEl = el; 
                        const parentContent = el.closest('.month-content'); 
                        if (parentContent && !parentContent.classList.contains('open')) { 
                            parentContent.classList.add('open'); 
                            parentContent.previousElementSibling.querySelector('.icon').innerText = '▼'; 
                        } 
                    } 
                }); 
                loadHistory(dateStr, null, targetEl, msgKey); 
            });
        }

        // ==========================================
        // 9. 界面读取控制
        // ==========================================
        function loadLiveChat() {
            currentView = "live"; 
            lastDate = ""; 
            lastMsgTimestamp = 0;
            closeActionMenu();
            
            const chatBox = document.getElementById('chat-box'); 
            Array.from(chatBox.children).forEach(child => { 
                if(child.id !== 'wx-action-menu') child.remove(); 
            });
            
            document.getElementById('search-input').value = ""; 
            document.getElementById('history-notice').style.display = 'none'; 
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
            
            const liveBtn = document.getElementById('live-chat-btn'); 
            if (liveBtn) liveBtn.classList.add('active');
            
            const todaySafe = new Date().toLocaleDateString().replace(/[\/\.]/g, '-');
            
            db.ref(ROOM_PREFIX + 'active_dates').once('value', snap => {
                let targetDate = todaySafe;
                let originalDate = new Date().toLocaleDateString();
                let maxTime = 0;
                
                if (snap.exists()) {
                    snap.forEach(child => {
                        let dTime = new Date(child.key.replace(/-/g, '/')).getTime();
                        if (dTime > maxTime) {
                            maxTime = dTime;
                            targetDate = child.key;
                            originalDate = child.val();
                        }
                    });
                }
                
                if (targetDate !== todaySafe) {
                    db.ref(ROOM_PREFIX + 'daily_messages/' + targetDate).limitToLast(50).once('value', dSnap => {
                        if (dSnap.exists()) {
                            chatBox.style.opacity = '0';
                            dSnap.forEach(child => renderMessage(child.val(), child.key));
                            setTimeout(() => { chatBox.style.opacity = '1'; }, 50);
                            setupLiveListener(todaySafe);
                        } else {
                            db.ref(ROOM_PREFIX + 'messages').orderByChild('date').equalTo(originalDate).limitToLast(50).once('value', oSnap => {
                                if (oSnap.exists()) {
                                    let updates = {};
                                    chatBox.style.opacity = '0';
                                    oSnap.forEach(child => {
                                        let v = child.val();
                                        v.date = targetDate;
                                        updates['daily_messages/' + targetDate + '/' + child.key] = v;
                                        updates['messages/' + child.key] = null;
                                        renderMessage(v, child.key);
                                    });
                                    db.ref(ROOM_PREFIX).update(updates);
                                    setTimeout(() => { chatBox.style.opacity = '1'; }, 50);
                                }
                                setupLiveListener(todaySafe);
                            });
                        }
                    });
                } else {
                    setupLiveListener(targetDate);
                }
            });
            
            if(window.innerWidth <= 600) document.getElementById('sidebar').classList.add('collapsed');
        }

        function setupLiveListener(dateStr) {
            currentLiveDate = dateStr;
            db.ref(ROOM_PREFIX + 'daily_messages/' + dateStr).off();
            
            db.ref(ROOM_PREFIX + 'daily_messages/' + dateStr).limitToLast(50).once('value', snapshot => {
                const chatBox = document.getElementById('chat-box');
                chatBox.style.opacity = '0'; 
                let loadedKeys = {};
                
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        renderMessage(child.val(), child.key);
                        loadedKeys[child.key] = true; 
                    });
                }
                setTimeout(() => { chatBox.style.opacity = '1'; }, 50); 
                
                db.ref(ROOM_PREFIX + 'daily_messages/' + dateStr).limitToLast(50).on('child_added', childSnap => { 
                    if (!loadedKeys[childSnap.key]) renderMessage(childSnap.val(), childSnap.key); 
                });
            });
        }

        function loadHistory(safeDate, originalDate, element, jumpMsgKey = null) {
            currentView = "history"; 
            lastDate = ""; 
            lastMsgTimestamp = 0;
            closeActionMenu();
            
            const chatBox = document.getElementById('chat-box'); 
            Array.from(chatBox.children).forEach(child => { 
                if(child.id !== 'wx-action-menu') child.remove(); 
            });
            
            document.getElementById('search-input').value = ""; 
            const notice = document.getElementById('history-notice'); 
            notice.innerText = "当前为「历史记录」模式。在此发送新消息或引用回复，将自动带您回到最新聊天。"; 
            notice.style.display = 'block';
            
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active')); 
            if (element) element.classList.add('active');
            
            db.ref(ROOM_PREFIX + 'daily_messages/' + safeDate).once('value', snapshot => {
                if (snapshot.exists()) { 
                    snapshot.forEach(child => renderMessage(child.val(), child.key)); 
                    if (jumpMsgKey) {
                        setTimeout(() => { 
                            const targetContainer = document.getElementById('msg-' + jumpMsgKey); 
                            if (targetContainer) { 
                                targetContainer.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
                                const b = targetContainer.querySelector('.bubble') || targetContainer;
                                b.classList.add('highlight-target'); 
                            } 
                        }, 100);
                    }
                } else {
                    notice.innerText = "正在为您整理当天的旧档案，马上就好...";
                    const queryTarget = originalDate ? originalDate : safeDate.replace(/-/g, '/');
                    
                    db.ref(ROOM_PREFIX + 'messages').orderByChild('date').equalTo(queryTarget).once('value', oldSnap => {
                        if (oldSnap.exists()) {
                            let updates = {};
                            oldSnap.forEach(child => {
                                let v = child.val();
                                v.date = safeDate; 
                                updates['daily_messages/' + safeDate + '/' + child.key] = v;
                                updates['messages/' + child.key] = null; 
                                renderMessage(v, child.key);
                            });
                            
                            db.ref(ROOM_PREFIX).update(updates).then(() => {
                                notice.innerText = "当前为「历史记录」模式。在此发送新消息或引用回复，将自动带您回到最新聊天。";
                                if (jumpMsgKey) {
                                    setTimeout(() => { 
                                        const targetContainer = document.getElementById('msg-' + jumpMsgKey); 
                                        if (targetContainer) { 
                                            targetContainer.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
                                            const b = targetContainer.querySelector('.bubble') || targetContainer;
                                            b.classList.add('highlight-target'); 
                                        } 
                                    }, 100);
                                }
                            });
                        } else {
                            notice.innerText = "啊哦，当天好像真的没有聊天记录。";
                        }
                    });
                }
            });
        }

        // ==========================================
        // 10. 发送消息系统
        // ==========================================
        function sendMessage() {
            const name = document.getElementById('user-name').value.trim(); 
            const text = document.getElementById('msg-input').value.trim();
            
            if (!text || !name) { 
                alert("名字和消息都不能为空哦！"); 
                return; 
            }
            
            if (text.includes("data:image/") && text.length > 500) {
                alert("⚠️ 警告：请不要直接粘贴图片！\n\n为了节省宝贵的数据库空间，请先将图片上传到外部免费图床，然后再把直接链接粘贴过来。");
                document.getElementById('msg-input').value = ""; 
                return; 
            }

            localStorage.setItem('chat_username', name); 
            updatePresence(); 
            
            const now = new Date(); 
            const safeDate = now.toLocaleDateString().replace(/[\/\.]/g, '-');
            const originalDate = now.toLocaleDateString(); 
            
            const payload = { 
                name: name, 
                text: text, 
                date: safeDate, 
                time: now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                timestamp: now.getTime()
            };
            
            if (currentReplyTarget) payload.reply = currentReplyTarget;

            if (currentView === "live" && currentLiveDate !== safeDate) {
                db.ref(ROOM_PREFIX + 'daily_messages/' + currentLiveDate).off();
                setupLiveListener(safeDate);
            }

            db.ref(ROOM_PREFIX + 'daily_messages/' + safeDate).push(payload).then(() => { 
                cancelReply(); 
                db.ref(ROOM_PREFIX + 'active_dates/' + safeDate).set(originalDate);
                if (currentView !== "live") loadLiveChat(); 
            });
            
            document.getElementById('msg-input').value = ""; 
            document.getElementById('msg-input').focus();
        }

        function handleEnter(e) { 
            if (e.isComposing || e.keyCode === 229) return; 
            if (e.key === 'Enter') { 
                if (isMobileDevice) return; 
                if (!e.shiftKey) { 
                    e.preventDefault(); 
                    sendMessage(); 
                } 
            } 
        }
    </script>
